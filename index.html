<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="映集，收录樱花、制服、角色写真与双人合照的人像作品集。">
  <meta name="robots" content="noindex,nofollow">
  <title>映集 · 人像作品集</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23232426'/%3E%3Cpath d='M7 12V7h5m8 0h5v5M7 20v5h5m8 0h5v-5' fill='none' stroke='white' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23edb7c5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#gallery">跳到作品</a>
  <header class="site-header page-width">
    <a class="brand" href="#top" aria-label="映集首页"><span class="brand-mark" aria-hidden="true"><i></i></span><span>映集<span class="brand-en">YING JI</span></span></a>
    <nav aria-label="主导航"><a href="#gallery">全部作品</a><button id="series-link" type="button">浏览系列</button></nav>
    <span class="header-edition">PERSONAL ARCHIVE <span>2026</span></span>
  </header>
  <main id="top">
    <section class="opening page-width" aria-labelledby="page-title">
      <div class="opening-heading"><div><p class="eyebrow">PORTRAIT COLLECTION</p><h1 id="page-title">人像作品集<span class="title-dot">.</span></h1></div><div class="opening-note"><span class="handwritten">Portraits in bloom</span><span class="small-caps">SELECTED WORKS / 2026</span></div></div>
      <div class="featured" id="featured" aria-label="精选作品"></div>
      <div class="feature-baseline"><span>樱花 · 角色写真 · 双人合照</span><span id="archive-count"></span></div>
    </section>
    <section class="archive page-width" id="gallery" aria-labelledby="archive-heading">
      <div class="archive-heading"><h2 id="archive-heading">作品<span>THE ARCHIVE</span></h2><label class="sort-control">排序 <select id="sort" aria-label="作品排序"><option value="newest">最新创作</option><option value="oldest">最早创作</option></select></label></div>
      <div class="filter-row"><div id="filters" class="filters" role="group" aria-label="作品系列"></div><span id="results-count" class="results-count" aria-live="polite"></span></div>
      <div class="gallery-grid" id="gallery-grid"></div>
      <div class="gallery-bottom"><button id="load-more" class="load-more" type="button" hidden>继续浏览<span id="remaining"></span></button><span id="end-note" hidden>— 已浏览全部作品 —</span></div>
      <div id="error-state" class="error-state" hidden><p>暂时无法载入作品。</p><button id="retry" type="button">重新加载</button></div>
      <noscript><p class="error-state">请启用 JavaScript，浏览完整作品集。</p></noscript>
    </section>
  </main>
  <footer class="site-footer page-width"><a class="footer-brand" href="#top">映集<span>YING JI</span></a><span>AI 生成影像 · 个人作品集</span><a class="back-top" href="#top">回到顶部</a></footer>
  <dialog id="lightbox" aria-labelledby="photo-title">
    <div class="viewer">
      <header class="viewer-header"><span class="viewer-wordmark">映集<span> / </span>作品</span><span id="viewer-counter" aria-live="polite"></span><button id="close-viewer" class="icon-button" aria-label="关闭大图" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></header>
      <div class="viewer-stage" id="viewer-stage"><button id="previous" class="icon-button viewer-nav previous" type="button" aria-label="上一张"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button><div class="viewer-image-wrap"><img id="viewer-image" alt="" draggable="false"><p id="image-error" hidden>图片暂时无法加载，请切换作品后重试。</p></div><button id="next" class="icon-button viewer-nav next" type="button" aria-label="下一张"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button></div>
      <footer class="viewer-caption"><div><span id="photo-category" class="viewer-category"></span><h2 id="photo-title"></h2></div><div class="viewer-meta"><span id="photo-date"></span><span id="photo-dimensions"></span></div></footer>
    </div>
  </dialog>
</body>
</html>
